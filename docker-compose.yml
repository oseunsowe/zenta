version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
    command: npm run dev -- --hostname 127.0.0.1

  backend:
    build:
      context: ./backend
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./backend:/app
    command: uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 --reload
