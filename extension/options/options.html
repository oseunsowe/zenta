<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1024; color: #e9ebf8; padding: 24px; max-width: 560px; }
      h1 { font-size: 18px; margin-top: 0; }
      label { display: block; margin-top: 16px; font-size: 13px; color: #aab1d8; }
      input { width: 100%; padding: 10px; background: #1a1f3a; color: #fff; border: 1px solid #2a2f4a; border-radius: 6px; margin-top: 6px; font-size: 14px; }
      button { margin-top: 16px; padding: 10px 16px; background: #3a4170; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
      .ok { color: #7ee0a0; margin-top: 10px; }
      p { color: #8f98ba; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Workspace Helper</h1>
    <p>The extension points at the companion frontend. Use the LAN IP (e.g. <code>http://192.168.1.42:3000</code>) for use on this machine while the backend runs locally; use the tunnel/hosted URL for remote.</p>
    <label>
      Backend URL
      <input id="backendUrl" type="url" placeholder="http://127.0.0.1:3000" />
    </label>
    <button id="save">Save</button>
    <span class="ok" id="ok" hidden>Saved</span>
    <script src="options.js"></script>
  </body>
</html>
