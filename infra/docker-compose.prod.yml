# Production stack. Both services bind to 127.0.0.1 on the host — only the
# reverse proxy (Caddy, see Caddyfile.public.example) is exposed publicly.
#
#   cp .env.example .env      # then fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# The frontend is served same-origin: Caddy proxies /api -> backend, everything
# else -> frontend, so the browser only ever sees one origin (no CORS needed).

services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: .env            # MUST define JWT_SECRET (and other secrets)
    # `environment:` overrides `env_file:`, which in turn overrides the image's
    # ENV. These four MUST live here: a stray relative path inherited from a
    # dev .env would silently write the databases into the container layer
    # instead of the backend_state volume, wiping every user on redeploy.
    environment:
      APP_ENV: production
      USERS_DB_PATH: /app/state/users.sqlite3
      STATE_FILE: /app/state/runtime_state.json
      MEMORY_SQLITE_PATH: /app/state/memory.sqlite3
      # Device IDs must survive redeploys or every machine gets a new
      # ID and previously shared IDs stop resolving.
      DEVICES_DB_PATH: /app/state/devices.sqlite3
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - backend_state:/app/state
    healthcheck:
      # `/` returns 204 unconditionally; `/health` is CIDR-gated and would 404
      # if HEALTH_ALLOWED_CIDRS is tightened. No curl in python:3.12-slim.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).status == 204 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../frontend    # builds Next.js standalone, served on :3000
      args:
        # Baked in at build time (see frontend/Dockerfile) for the marketing
        # page's canonical URL, Open Graph image, and sitemap.xml.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # TURN relay for WebRTC media/data channels — never proxied through Caddy or
  # a Cloudflare tunnel (Caddy is HTTP(S)-only and can't carry raw UDP media
  # anyway). Requires UDP 3478 and the relay port range opened directly on the
  # VPS firewall/security group; see infra/README.md and infra/.env.example.
  # If TURN_SHARED_SECRET is left unset, the backend hands out STUN-only
  # iceServers and this container isn't needed — fine for same-LAN testing,
  # not for two arbitrary networks.
  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    # Host networking: coturn must advertise the VPS's real public IP as the
    # relay-candidate address. Docker's default bridge network would instead
    # advertise the container's private IP, which no external peer can reach —
    # breaking every relay candidate. The tradeoff is the container shares the
    # host's network namespace directly (no port-mapping isolation); if you'd
    # rather avoid that, drop `network_mode: host` and instead publish
    # `3478:3478/udp`, `3478:3478/tcp`, and `49160-49200:49160-49200/udp`.
    network_mode: host
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
      TURN_REALM: ${TURN_REALM:-zenta.example.com}
    command: >
      -n --log-file=stdout
      --listening-port=3478
      --min-port=49160 --max-port=49200
      --use-auth-secret --static-auth-secret=${TURN_SHARED_SECRET}
      --realm=${TURN_REALM:-zenta.example.com}
      --external-ip=${TURN_EXTERNAL_IP}
      --no-cli --no-tls --no-dtls

volumes:
  backend_state:
